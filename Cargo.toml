[package]
name = "swch"
version = "1.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
sysinfo = "0.30"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2.5"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
open = "5.1"
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.0", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.0", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.0", features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = "3.10"
http-body-util = "0.1"
