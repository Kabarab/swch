[package]
name = "swch"
version = "1.3.6"
edition = "2021"
default-run = "swch"

[[bin]]
name = "swch-autoclaimer"
path = "mods/autoclaimer/native/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
getrandom = "0.2"
aes = "0.8"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls", "cookies", "stream"] }
steamroom = "=0.3.0"
prost = "0.14"
crc32fast = "1.4"
sha2 = "0.10"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
futures-util = "0.3"
tokio-tungstenite = "0.29"
tempfile = "3.10"
sysinfo = "0.30"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2.5"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.9", features = ["serde"] }
dirs = "5.0"
open = "5.1"
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
semver = "1.0"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.0", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.0", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.0", features = ["sync-secret-service"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["test-util"] }
http-body-util = "0.1"
