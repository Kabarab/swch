<!doctype html><html lang="ru"><meta charset="utf-8"><style>body{padding:28px;font:16px system-ui;background:#17243b;color:#edf2ff}pre{white-space:pre-wrap}</style><h1>Демонстрационный лаунчер</h1><p>Открой «Моды» и подключи аккаунт Demo Launcher. Затем загрузи библиотеку и запусти SWCH Mod Demo из общей библиотеки.</p><h2>Последний запуск</h2><button id="reload">Обновить</button><pre id="launch"></pre><script>async function load(){document.getElementById('launch').textContent=JSON.stringify(await swch.call('storage.get',{key:'last-launch'}),null,2);}document.getElementById('reload').onclick=load;load();</script></html>
