name: Mod engine and SDK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  mods:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: node --test tests/mod-sdk.test.mjs tests/mod-jobs-sdk.test.mjs tests/mod-runtime.test.mjs
      - run: cargo test --lib mods::
      - run: cargo test --test mods_tests --test mod_jobs_tests --test mod_assets_tests --test mod_large_packages_tests --test mod_native_tools_tests
