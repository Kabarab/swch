name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build Backend (Rust Release)
        run: cargo build --release

      - name: Build Native GUI Launcher (Swift)
        run: swiftc -O src/mac_app.swift -o swch_gui

      - name: Assemble swch.app Bundle
        run: |
          mkdir -p swch.app/Contents/MacOS
          mkdir -p swch.app/Contents/Resources/web
          cp swch_gui swch.app/Contents/MacOS/swch
          if [ -f "target_build/release/swch" ]; then
            cp target_build/release/swch swch.app/Contents/MacOS/swch-server
          elif [ -f "target/aarch64-apple-darwin/release/swch" ]; then
            cp target/aarch64-apple-darwin/release/swch swch.app/Contents/MacOS/swch-server
          else
            cp target/release/swch swch.app/Contents/MacOS/swch-server
          fi
          chmod +x swch.app/Contents/MacOS/*
          cp index.html swch.app/Contents/Resources/web/
          cp -r ui swch.app/Contents/Resources/web/
          zip -r -q swch-macos-arm64.zip swch.app

      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: swch-macos-arm64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Backend (Rust Release)
        run: cargo build --release

      - name: Build Native Windows GUI Launcher
        shell: pwsh
        run: |
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) {
            Write-Host "Compiling Windows GUI launcher using MSVC cl.exe..."
            cl.exe /O2 /MT /EHsc /std:c++17 /Isrc src/windows_app.cpp /Fe:swch_gui.exe /link /SUBSYSTEM:WINDOWS winhttp.lib dwmapi.lib shlwapi.lib ole32.lib oleaut32.lib user32.lib gdi32.lib shell32.lib advapi32.lib
          } elseif (Get-Command g++ -ErrorAction SilentlyContinue) {
            Write-Host "Compiling Windows GUI launcher using g++..."
            g++ -O2 -Isrc src/windows_app.cpp -o swch_gui.exe -mwindows -municode -lwinhttp -ldwmapi -lshlwapi -lole32 -loleaut32
          } else {
            throw "No suitable C++ compiler (cl.exe or g++) found for building Windows GUI launcher"
          }

      - name: Package Windows Application
        shell: pwsh
        run: |
          $binPath = if (Test-Path "target_build/release/swch.exe") { "target_build/release/swch.exe" } elseif (Test-Path "target/x86_64-pc-windows-msvc/release/swch.exe") { "target/x86_64-pc-windows-msvc/release/swch.exe" } else { "target/release/swch.exe" }
          New-Item -ItemType Directory -Force -Path "package"
          Copy-Item "swch_gui.exe" -Destination "package/swch.exe"
          Copy-Item $binPath -Destination "package/swch-server.exe"
          if (Test-Path "src/webview2/WebView2Loader.dll") {
            Copy-Item "src/webview2/WebView2Loader.dll" -Destination "package/WebView2Loader.dll"
          }
          Copy-Item "index.html" -Destination "package/"
          Copy-Item -Recurse "ui" -Destination "package/"
          Compress-Archive -Path package/* -DestinationPath swch-windows-x86_64.zip
          Copy-Item swch-windows-x86_64.zip swch-windows-amd64.zip

      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            swch-windows-x86_64.zip
            swch-windows-amd64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
