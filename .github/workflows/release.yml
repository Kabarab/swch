name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod-regressions:
    uses: ./.github/workflows/mod-tests.yml
    permissions:
      contents: read
  ui-regressions:
    name: Verify interface before packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - run: npm ci
        working-directory: tests/ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tree-sitter==0.25.2 tree-sitter-javascript==0.25.0 tree-sitter-rust==0.24.2
      - run: python scripts/extract_i18n.py --check
      - run: node scripts/language-packs.mjs --check
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui
      - run: npm test
        working-directory: tests/ui
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check-screenshots
          path: |
            output/ux-redesign
            output/accounts-redesign/*.png
            output/inventory-layout-*.png
            output/riot-inventory
            output/deadlock-stats
            output/mods/*.png
            output/i18n/*.png

  game-stats-regressions:
    name: Verify playtime and character statistics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux keyring build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test --test deadlock_hero_tests --test steam_game_stats_tests --test playtime_tests --test riot_profiles_tests --test i18n_tests

  build-macos:
    needs: [ui-regressions, game-stats-regressions, mod-regressions]
    name: Build macOS Application
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.5'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Backend (Rust Release)
        run: cargo build --release

      - name: Build Native GUI Launcher (Swift)
        run: swiftc -O -target arm64-apple-macosx13.5 src/mac_app.swift -o swch_gui

      - name: Assemble swch.app Bundle
        run: |
          mkdir -p swch.app/Contents/MacOS
          mkdir -p swch.app/Contents/Resources/web
          cp swch_gui swch.app/Contents/MacOS/swch
          if [ -f "target_build/release/swch" ]; then
            cp target_build/release/swch swch.app/Contents/MacOS/swch-server
          elif [ -f "target/aarch64-apple-darwin/release/swch" ]; then
            cp target/aarch64-apple-darwin/release/swch swch.app/Contents/MacOS/swch-server
          else
            cp target/release/swch swch.app/Contents/MacOS/swch-server
          fi
          chmod +x swch.app/Contents/MacOS/*
          cp index.html swch.app/Contents/Resources/web/
          cp -r ui swch.app/Contents/Resources/web/
          node scripts/language-packs.mjs --bundle swch.app/Contents/Resources/web/ui/lang
          cp -r browser-extension swch.app/Contents/Resources/web/
          node scripts/bundle-mod-runtime.mjs macos-arm64 swch.app/Contents/Resources/runtime
          codesign --force --sign - swch.app
          codesign --verify --deep --strict swch.app
          zip -r -q swch-macos-arm64.zip swch.app

      - name: Build native macOS installer
        run: python scripts/build-macos-installer.py

      - name: Test macOS application installation
        run: |
          version=$(python -c 'import plistlib; print(plistlib.load(open("swch.app/Contents/Info.plist", "rb"))["CFBundleShortVersionString"])')
          python scripts/test-macos-installer.py --installer "output/installers/SWCH-Setup-$version-arm64.pkg" --bundle swch.app

      - name: Save macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            swch-macos-arm64.zip
            output/installers/*.pkg
          if-no-files-found: error

  build-windows:
    needs: [ui-regressions, game-stats-regressions, mod-regressions]
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Backend (Rust Release)
        run: cargo build --release

      - name: Build Native Windows GUI Launcher
        shell: pwsh
        run: |
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) {
            Write-Host "Compiling Windows GUI launcher using MSVC cl.exe..."
            rc.exe /nologo /Isrc /foswch_resources.res src/windows_app.rc
            if ($LASTEXITCODE -ne 0) { throw 'Windows icon resource build failed' }
            cl.exe /O2 /MT /EHsc /utf-8 /std:c++17 /Isrc src/windows_app.cpp swch_resources.res /Fe:swch_gui.exe /link /SUBSYSTEM:WINDOWS winhttp.lib dwmapi.lib shlwapi.lib ole32.lib oleaut32.lib user32.lib gdi32.lib shell32.lib advapi32.lib uuid.lib
          } elseif (Get-Command g++ -ErrorAction SilentlyContinue) {
            Write-Host "Compiling Windows GUI launcher using g++..."
            windres -I src src/windows_app.rc -O coff -o swch_resources.o
            if ($LASTEXITCODE -ne 0) { throw 'Windows icon resource build failed' }
            g++ -O2 -Isrc src/windows_app.cpp swch_resources.o -o swch_gui.exe -mwindows -municode -lwinhttp -ldwmapi -lshlwapi -lole32 -loleaut32 -lshell32 -ladvapi32 -luuid
          } else {
            throw "No suitable C++ compiler (cl.exe or g++) found for building Windows GUI launcher"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI build failed' }

      - name: Test Windows Startup Settings
        shell: pwsh
        run: |
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) {
            cl.exe /O2 /MT /EHsc /utf-8 /std:c++17 tests/windows_startup_tests.cpp /Fe:windows_startup_tests.exe /link advapi32.lib shell32.lib
          } else {
            g++ -O2 -std=c++17 tests/windows_startup_tests.cpp -o windows_startup_tests.exe -ladvapi32 -lshell32
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup test build failed' }
          ./windows_startup_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup tests failed' }

      - name: Package Windows Application
        shell: pwsh
        run: |
          $binPath = if (Test-Path "target_build/release/swch.exe") { "target_build/release/swch.exe" } elseif (Test-Path "target/x86_64-pc-windows-msvc/release/swch.exe") { "target/x86_64-pc-windows-msvc/release/swch.exe" } else { "target/release/swch.exe" }
          New-Item -ItemType Directory -Force -Path "package"
          Copy-Item "swch_gui.exe" -Destination "package/swch.exe" -Force
          Copy-Item $binPath -Destination "package/swch-server.exe" -Force
          if (Test-Path "src/webview2/WebView2Loader.dll") {
            Copy-Item "src/webview2/WebView2Loader.dll" -Destination "package/WebView2Loader.dll" -Force
          }
          Copy-Item "index.html" -Destination "package/" -Force
          Copy-Item -Recurse "ui" -Destination "package/" -Force
          node scripts/language-packs.mjs --bundle package/ui/lang
          Copy-Item -Recurse "browser-extension" -Destination "package/" -Force
          node scripts/bundle-mod-runtime.mjs windows-x64 package/runtime
          Compress-Archive -Path package/* -DestinationPath swch-windows-x86_64.zip -Force
          Copy-Item swch-windows-x86_64.zip swch-windows-amd64.zip -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1
          Copy-Item output/installers/*.exe .

      - name: Test Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          ./scripts/test-windows-installer.ps1 -Installer "output/installers/SWCH-Setup-$version.exe" -PackageDirectory package

      - name: Save Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            swch-windows-x86_64.zip
            swch-windows-amd64.zip
            SWCH-Setup-*.exe
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Locate release notes
        id: notes
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SWCH ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release-assets/*.zip
            release-assets/*.exe
            release-assets/**/*.pkg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
