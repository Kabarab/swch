name: Language packs
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['ui/lang/**', 'ui/i18n-core.mjs', 'scripts/*language-packs*', '.github/workflows/language-packs.yml']
permissions:
  contents: write
concurrency:
  group: language-packs
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tree-sitter==0.25.2 tree-sitter-javascript==0.25.0 tree-sitter-rust==0.24.2
      - run: python scripts/extract_i18n.py --check
      - run: node scripts/language-packs.mjs --check
      - run: node --test tests/ui/i18n.test.mjs
      - run: node scripts/publish-language-packs.mjs
